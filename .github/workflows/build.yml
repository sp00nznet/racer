# Compile check for Linux and macOS. The recompiled game needs the player's ROM, so CI builds
# everything around it (RT64, the runtime, the frontend and main.cpp) with stand-ins for the
# ROM-derived files. setup.sh does the full build on the player's machine.
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libsdl2-dev libgtk-3-dev libx11-dev libxrandr-dev
      - if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - run: |
          for t in N64ModernRuntime rt64; do git clone -q --recurse-submodules --branch main https://github.com/sp00nznet/$t deps/$t; done
          mkdir -p RecompiledFuncs && echo 'int recomp_stand_in;' > RecompiledFuncs/stub.c && touch rsp/aspMain.cpp
      - run: |
          compilers=; [ "$RUNNER_OS" = Linux ] && compilers="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo $compilers
          cmake --build build --target n64frontend CMakeFiles/SWE1Racer.dir/src/main.cpp.o
